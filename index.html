<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unidor de Expedientes PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header><div><h1>Unidor de Expedientes PDF</h1><p>Desarrollado por: Brayan Huaman - Ingeniería y Planeamiento</p></div></header>
    <section class="card">
      <h2>Selecciona un archivo ZIP</h2>
      <label class="picker" for="zipInput"><span>Seleccionar archivo ZIP</span><input id="zipInput" type="file" accept=".zip,application/zip"></label>
      <p id="fileName" class="file-name">Ningún ZIP seleccionado.</p>
      <div class="output-mode" role="radiogroup" aria-label="Formato de salida">
        <label class="mode-option"><input type="radio" name="outputMode" value="flat" checked><span>Solo PDFs compilados</span></label>
        <label class="mode-option"><input type="radio" name="outputMode" value="company"><span>Organizar por compañía</span></label>
      </div>
      <button id="processButton" disabled>Generar resultado</button>
    </section>
    <section class="card status-card"><div class="progress"><div id="progressBar"></div></div><p id="status">Listo para seleccionar un ZIP.</p></section>
    <section class="card"><h2>Registro y alertas</h2><pre id="log" aria-live="polite"></pre></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
