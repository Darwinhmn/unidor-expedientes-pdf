<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unidor de Expedientes PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header><img src="logo_volcan.png" alt="Volcan" class="logo"><div><h1>Unidor de Expedientes PDF</h1><p>Unidad Minera Chungar</p></div></header>
    <section class="card">
      <h2>Compilar expedientes</h2>
      <p class="hint">Los archivos se procesan en este navegador. No se cargan a Internet.</p>
      <label class="picker" for="zipInput"><span>Seleccionar archivo ZIP</span><input id="zipInput" type="file" accept=".zip,application/zip"></label>
      <p id="fileName" class="file-name">Ningún ZIP seleccionado.</p>
      <button id="processButton" disabled>Generar resultado</button>
    </section>
    <section class="card status-card"><div class="progress"><div id="progressBar"></div></div><p id="status">Listo para seleccionar un ZIP.</p></section>
    <section class="card"><h2>Registro y alertas</h2><pre id="log" aria-live="polite"></pre></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
